name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked --all-packages --group dev ruff format --check .
      - run: uv run --locked --all-packages --group dev ruff check .
      - run: uv run --locked --all-packages --group dev mypy packages/configuration/src scripts
      - run: uv run --locked --all-packages --group dev pytest -p no:cacheprovider
      - run: uv run --locked --all-packages --group dev python scripts/check_boundaries.py
      - run: uv run --locked --all-packages --group dev python scripts/smoke_workspace.py
      - run: uv run --locked --all-packages --group dev python scripts/export_startup_schema.py --check
      - run: uv build --all-packages

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@12.5.1 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @polycodebench/web typecheck
      - run: corepack pnpm --filter @polycodebench/web lint
      - run: corepack pnpm --filter @polycodebench/web build
