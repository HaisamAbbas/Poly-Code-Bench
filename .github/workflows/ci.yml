name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: pcb_prompt03_ci_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PCB_MIGRATION_DATABASE_URL: postgresql://postgres@localhost:5432/pcb_prompt03_ci_test
      PCB_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/pcb_prompt03_ci_test
      PCB_OBJECT_STORE_ENDPOINT: http://127.0.0.1:8333
      PCB_BUCKET_HIDDEN: pcb-p04-hidden
      PCB_BUCKET_INTERNAL: pcb-p04-internal
      PCB_BUCKET_PUBLIC: pcb-p04-public
      AWS_ACCESS_KEY_ID: local-development-only
      AWS_SECRET_ACCESS_KEY: local-development-only
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --all-packages --group dev
      - run: uv run --locked --all-packages --group dev ruff format --check .
      - run: uv run --locked --all-packages --group dev ruff check .
      - run: uv run --locked --all-packages --group dev mypy packages/core/src packages/configuration/src scripts
      - run: psql "$PCB_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/persistence/sql/provision_roles.sql
      - run: uv run --locked alembic -c packages/persistence/alembic.ini upgrade head
      - run: psql "$PCB_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/persistence/sql/grant_permissions.sql
      - run: uv run --locked alembic -c packages/persistence/alembic.ini check
      - run: docker run -d --name pcb-seaweedfs -p 8333:8333 chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d mini -dir=/data
      - run: for attempt in $(seq 1 30); do curl -s http://127.0.0.1:8333/ >/dev/null && exit 0; sleep 2; done; exit 1
      - run: uv run --locked --all-packages --group dev pytest -p no:cacheprovider
      - run: uv run --locked --all-packages --group dev python scripts/check_boundaries.py
      - run: uv run --locked --all-packages --group dev python scripts/smoke_workspace.py
      - run: uv run --locked --all-packages --group dev python scripts/export_startup_schema.py --check
      - run: uv run --locked --all-packages --group dev python scripts/export_contract_schemas.py --check
      - run: uv build --all-packages

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@12.5.1 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @polycodebench/contracts typecheck
      - run: corepack pnpm --filter @polycodebench/contracts build
      - run: corepack pnpm --filter @polycodebench/contracts test:contracts
      - run: corepack pnpm --filter @polycodebench/web typecheck
      - run: corepack pnpm --filter @polycodebench/web lint
      - run: corepack pnpm --filter @polycodebench/web build
