name: polycodebench-local
services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: polycodebench
      POSTGRES_USER: polycodebench
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polycodebench -d polycodebench"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  object-store:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: local-development-only
      AWS_SECRET_ACCESS_KEY: local-development-only
      S3_BUCKET: pcb-local
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-store-data:/data
volumes:
  postgres-data:
  object-store-data:
