name: polycodebench-local
services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: polycodebench
      POSTGRES_USER: polycodebench
      POSTGRES_PASSWORD: ${PCB_LOCAL_POSTGRES_PASSWORD:?run scripts/local_stack.py prepare first}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polycodebench -d polycodebench"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  object-store:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${PCB_LOCAL_S3_ACCESS_KEY:?run scripts/local_stack.py prepare first}
      AWS_SECRET_ACCESS_KEY: ${PCB_LOCAL_S3_SECRET_KEY:?run scripts/local_stack.py prepare first}
      S3_BUCKET: pcb-local
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-store-data:/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    profiles: ["local-auth"]
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://127.0.0.1:8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?run scripts/local_stack.py prepare first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/local_stack.py prepare first}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./.cache/keycloak-import:/opt/keycloak/data/import:ro
    restart: unless-stopped
volumes:
  postgres-data:
  object-store-data:
  keycloak-data:
