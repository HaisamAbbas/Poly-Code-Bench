  - {check_id: c.cppcheck.uninitvar, items: [undefined_behavior], owner: robustness, applicability: ub-opportunity, equivalence_family: uninitialised-value}
  - {check_id: c.cppcheck.uninitdata, items: [undefined_behavior], owner: robustness, applicability: ub-opportunity, equivalence_family: uninitialised-value}
