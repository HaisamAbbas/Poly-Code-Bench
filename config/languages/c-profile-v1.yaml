  # --- catch-alls ------------------------------------------------------------------------------
  # Anything a checker reports that no reviewed mapping names is recorded as a lint-style observation
  # and never silently discarded - so a check added to the bundle later still shows up, unmapped,
  # rather than vanishing.
  - {check_prefix: c.tidy.bugprone., items: [const_ownership, error_checks], owner: null, applicability: item-opportunity}
  - {check_prefix: c.tidy.performance., items: [performance_cache], owner: null, applicability: item-opportunity}
  - {check_prefix: c.tidy.portability., items: [portability], owner: null, applicability: item-opportunity}
  - {check_prefix: c.tidy.cert., items: [const_ownership, error_checks], owner: null, applicability: item-opportunity}
  - {check_prefix: c.tidy., items: [const_ownership], owner: null, applicability: item-opportunity}
  - {check_prefix: c.cppcheck., items: [const_ownership], owner: null, applicability: item-opportunity}
  # --- security (measured evidence only; there is no diagnostic item for it) -------------------
  - {check_prefix: c.asan.severity-surface, owner: security, applicability: always}