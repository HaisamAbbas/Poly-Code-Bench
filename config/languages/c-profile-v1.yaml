  - {check_id: c.tidy.cert.pos47-c, items: [error_checks], owner: null, applicability: error-opportunity, equivalence_family: pos47-c}
  - {check_id: c.tidy.cert.sig30-c, items: [error_checks], owner: null, applicability: error-opportunity, equivalence_family: sig30-c}
  - {check_id: c.tidy.cert.str34-c, items: [memory_safety], owner: security, applicability: memory-opportunity, equivalence_family: printf-family}
