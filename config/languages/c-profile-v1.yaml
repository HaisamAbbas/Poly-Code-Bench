  - {check_id: c.cppcheck.strlencall, items: [memory_safety], owner: robustness, applicability: memory-opportunity, equivalence_family: bounds-violation}
  - {check_id: c.cppcheck.strcpy, items: [memory_safety], owner: security, applicability: memory-opportunity, equivalence_family: unbounded-copy}
  - {check_id: c.cppcheck.sprintfoverlappingdata, items: [memory_safety], owner: robustness, applicability: memory-opportunity, equivalence_family: unbounded-copy}
  - {check_id: c.cppcheck.unreadvariable, items: [undefined_behavior], owner: null, applicability: ub-opportunity, equivalence_family: unread-variable}
  - {check_id: c.cppcheck.readwriteonlyfile, items: [error_checks], owner: null, applicability: error-opportunity, equivalence_family: read-write-only-file}
  - {check_id: c.cppcheck.ignoredreturnvalue, items: [error_checks], owner: null, applicability: error-opportunity, equivalence_family: unchecked-return-value}
  - {check_id: c.cppcheck.unnecessaryelse, items: [error_checks], idiom_item: data_function_interfaces, owner: null, applicability: error-opportunity, equivalence_family: unnecessary-else}
  - {check_id: c.cppcheck.variablescope, items: [const_ownership], owner: null, applicability: const-opportunity, equivalence_family: variable-scope}
