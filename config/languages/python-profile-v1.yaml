  - {check_id: python.context.assert-validation, items: [error_handling], owner: null, applicability: item-opportunity}
  - {check_id: python.context.open-without-context-manager, items: [error_handling], owner: robustness, applicability: item-opportunity, equivalence_family: open-without-context-manager}
  - {check_id: python.ruff.sim115, items: [error_handling], owner: robustness, applicability: item-opportunity, equivalence_family: open-without-context-manager}
  - {check_id: python.context.lock-acquire-without-release-guard, items: [error_handling], owner: robustness, applicability: item-opportunity}
  # --- Ruff by rule family ----------------------------------------------------------------------
