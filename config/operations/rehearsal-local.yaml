# Source environment for the local-docker recovery rehearsal (E2E-42 local variant).
# Uses the trusted local compose services; the restore target is always a NEW isolated pair
# created and destroyed by `pcb-ops restore rehearse`. Credential values live only in ignored
# .env and are referenced by variable name here.
schema_version: 1
target: local-docker
source:
  postgres_container: polycodebench-local-postgres-1
  database: pcb_ops_rehearsal_source
  database_url_env: PCB_OPS_REHEARSAL_DATABASE_URL
  admin_database_url_env: PCB_MIGRATION_DATABASE_URL
  object_store_access_key_env: PCB_LOCAL_S3_ACCESS_KEY
  object_store_secret_key_env: PCB_LOCAL_S3_SECRET_KEY
  object_store_endpoint: http://127.0.0.1:8333
  buckets:
    hidden: pcb-ops-src-hidden
    internal: pcb-ops-src-internal
    public: pcb-ops-src-public
  release_store_path: .local/ops-rehearsal/source/releases.db
  keyring_path: .local/ops-rehearsal/source/keyring.json
  signing_key_dir: .local/ops-rehearsal/source/signing
  board: local:board
replay:
  count: 10
  seed: pcb-restore-rehearsal-v1
