schema_version: 1
kind: evidence_ownership_policy
policy_id: evidence-ownership-pilot-v1
status: pilot_parameters_unvalidated
effective_for_scoring: false
invariant: each_canonical_issue_has_one_composite_owner
rules:
  - family: canonical-security-issue
    owner: security
    allow_task_override_before_freeze: true
  - family: measured-runtime-regression
    owner: efficiency
    allow_task_override_before_freeze: true
  - family: resource-cleanup-failure
    owner: robustness
    allow_task_override_before_freeze: true
  - family: language-api-design
    owner: idiomatic
    allow_task_override_before_freeze: true
diagnostic_reuse:
  allowed: true
  duplicate_composite_penalty: false
required_evidence:
  - canonical_issue_key
  - baseline_relation
  - evidence_reference
  - confidence
  - adjudication_when_required
