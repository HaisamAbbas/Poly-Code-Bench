schema_version: 1
kind: scoring_policy
policy_id: polycodebench-code-pilot-v1
status: owner_approved_pending_calibration
effective_for_scoring: false
owner_approval: approved
approved_by: project_owner
approved_on: 2026-09-30
approval_scope: freeze_as_pilot_baseline_only
calibration_status: pending
source: PolyCodeBench-Architecture-v1.md §8; PolyCodeBench-Technical-Implementation-Spec-v1.md §14
code_composite:
  unit: basis_points
  weights:
    correctness: 3000
    security: 2000
    efficiency: 1500
    code_quality: 1500
    idiomatic: 1000
    robustness: 1000
  failed_correctness_gate_composite: 0
  missing_required_evidence: nonpublishable
  unavailable_infrastructure_gate: unknown
  not_applicable_quality_redistribution: fixed_relative_quality_weights
security:
  penalties: {critical: 50, high: 25, medium: 10, low: 3}
  counting: unique_confirmed_issue_primary_owner_only
  advisory_snapshot_required: true
efficiency:
  warmups: 5
  paired_measured_iterations: 20
  workload_scales_minimum: 3
  single_thread_default: true
  timing_breakpoint: 4
  memory_breakpoint: 2
  time_weight: 7000
  memory_weight: 3000
  benchmark_floor_and_censor_policy: task_admission_frozen
code_quality:
  items:
    naming_readability: 2000
    decomposition: 2500
    duplication: 1500
    unnecessary_complexity: 1500
    repository_style_consistency: 1500
    minimal_relevant_scope: 1000
  anchors: [0, 0.5, 1]
idiomatic:
  scoring_source: config/languages/profiles-v1.yaml
  full_language_profiles_are_diagnostic_only: true
  scoring_items_require_single_primary_owner: true
robustness:
  scoring_source: task_frozen_quality_only_scenarios
  duplicate_test_count_bonus: false
judge:
  minimum_votes_per_applicable_item: 3
  model_must_differ_from_candidate: true
  blinded: [candidate_identity, provider, rank, cost]
  human_and_judge_calibration: required_before_scored_use
