[project]
name = "polycodebench-api"
version = "0.1.0"
description = "Public read API and administrative routes over published release projections."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polycodebench-core",
  "polycodebench-persistence",
  "polycodebench-publication",
  "polycodebench-scoring",
  "polycodebench-services",
  "fastapi>=0.115,<0.150",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
pcb = "polycodebench_api.audit_cli:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polycodebench_api"
module-root = "src"

[tool.uv.sources]
polycodebench-core = { workspace = true }
polycodebench-persistence = { workspace = true }
polycodebench-publication = { workspace = true }
polycodebench-scoring = { workspace = true }
polycodebench-services = { workspace = true }
