[project]
name = "polycodebench-persistence"
version = "0.1.0"
description = "PolyCodeBench persistence and migration ownership boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polycodebench-core==0.1.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "boto3==1.43.105",
  "alibabacloud-credentials==1.0.12",
]

[tool.uv.sources]
polycodebench-core = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"
