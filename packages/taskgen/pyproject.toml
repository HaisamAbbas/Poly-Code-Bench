[project]
name = "polycodebench-taskgen"
version = "0.1.0"
description = "PolyCodeBench contamination controls for generated and parametric evaluation tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polycodebench-core==0.1.0",
  "pydantic==2.13.5",
]

[project.scripts]
pcb-taskgen = "polycodebench_taskgen.cli:main"

[tool.uv.sources]
polycodebench-core = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"
