[project]
name = "polycodebench-lang-c"
version = "0.1.0"
description = "PolyCodeBench C language plugin: pinned recipes, profiles, sanitizer and analyzer evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polycodebench-core==0.1.0",
  "polycodebench-plugins-api==0.1.0",
  "PyYAML==6.0.3",
]

[project.entry-points."polycodebench.language_plugins"]
c = "polycodebench_lang_c.plugin:CLanguagePlugin"

[tool.uv.sources]
polycodebench-core = { workspace = true }
polycodebench-plugins-api = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"