fixtures:
- name: reference
  variant: reference
  solution_path: hidden/reference/src/top_words.cpp
  expectation: {}
- name: faulty-ties
  variant: faulty
  solution_path: admission/faulty-ties/src/top_words.cpp
  expectation:
    failing_cases:
    - behaviour::ties_break_alphabetically
- name: alternative-sort
  variant: alternative
  solution_path: admission/alternative-sort/src/top_words.cpp
  expectation: {}
- name: quality-defective
  variant: quality_defective
  solution_path: admission/quality-defective/src/top_words.cpp
  expectation:
    # Equivalence families, not scanner rule names: this list is compared against the family
    # component of each observation's issue_key, so naming a rule here would never match.
    expected_issue_families:
    - manual-ownership
    - value-copy
    - index-loop
    - throwing-destructor
- name: timeout-case
  variant: timeout
  solution_path: admission/timeout-case/src/top_words.cpp
  expectation:
    expected_failure: candidate_timeout
# The remaining four are *quality* fixtures, not acceptance ones: they pass the behaviour contract
# and are rejected only by an instrumented or crashing lane. They carry the same `faulty` variant as
# faulty-ties because they all fail the task; what distinguishes them is which lane observes them.
- name: ownership-defective
  variant: faulty
  solution_path: admission/ownership-defective/src/top_words.cpp
  expectation:
    # Family names are the profile's equivalence families, not the sanitizer's own wording: a
    # double free and a use-after-free are one ownership defect reported at run time, so they
    # share the `manual-ownership` family with the context scanner and cannot be counted twice.
    expected_lane_findings:
      asan:
      - manual-ownership
      - undefined-behaviour
- name: leak-defective
  variant: faulty
  solution_path: admission/leak-defective/src/top_words.cpp
  expectation:
    expected_lane_findings:
      asan:
      - manual-ownership
- name: race-defective
  variant: faulty
  solution_path: admission/race-defective/src/top_words.cpp
  expectation:
    expected_lane_findings:
      tsan:
      - data-race
- name: exception-defective
  variant: faulty
  solution_path: admission/exception-defective/src/top_words.cpp
  expectation:
    expected_failure: candidate_crash