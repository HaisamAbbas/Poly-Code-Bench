# Staticcheck configuration for the PolyCodeBench Go profile (Prompt 22, PCB-22-2).
#
# Only the `SA`, `S1`, `ST1` and `QF1` families are enabled, and only the checks that describe a
# genuine defect or required behaviour:
#
#   SA  correctness          - the same class of defect as a failing test
#   S1  simplification      - a clearer, directly available formulation of code that already works
#   ST1 style               - naming and initialism conventions that a package API commits to
#   QF1 quickfix            - suggestions whose fix is mechanical
#
# Deliberately excluded:
#
#   * everything under `ST` beyond `ST1000`-`ST1023` - the remaining style checks are taste, and a
#     valid alternative implementation may reasonably disagree with them;
#   * the whole `ST1000`-`ST1003` package/identifier naming set is kept, because an exported
#     identifier's initialism (`Id` vs `ID`, `Url` vs `URL`) is part of the API contract other
#     packages compile against;
#   * checks the context scanner owns. A construct that is only a defect in context - a discarded
#     error, a replaced context, an unjoined goroutine - is decided by the scanner from the
#     surrounding evidence, and the two reports share one canonical issue family so the same
#     defect cannot be penalised twice.
checks = ["SA*", "S1*", "ST1000", "ST1001", "ST1003", "ST1005", "ST1006", "ST1008", "ST1011",
          "ST1012", "ST1013", "ST1015", "ST1016", "ST1017", "ST1020", "ST1021", "ST1022",
          "QF1*"]
initialisms = ["ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP",
               "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH",
               "TCP", "TLS", "TTL", "UDP", "UI", "UID", "URI", "URL", "UTF8", "UUID", "VM",
               "XML", "XMPP", "XSRF", "XSS"]
dot_import_whitelist = []
initialism_whitelist = []
http_status_code_whitelist = []