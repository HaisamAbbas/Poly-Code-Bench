# PolyCodeBench Python rule bundle: Ruff selection (frozen with the rule bundle digest).
# Security rules belong to Bandit/Semgrep (single evidence owner); only error-handling,
# idiom, performance-awareness and lint rules are selected here.
line-length = 100
target-version = "py312"
respect-gitignore = false

[lint]
select = [
  "E", "W", "F",        # pycodestyle / pyflakes
  "B",                   # bugbear (B006 is merged with the context scan by issue key)
  "C4",                  # comprehension idioms
  "SIM",                 # simplifications
  "PERF",                # performance awareness
  "PIE", "RET", "UP",    # misc idioms
  "BLE", "E722", "TRY002", "TRY003", "TRY004", "TRY201", "TRY203",  # error handling
  "RUF005", "RUF012", "RUF013", "RUF015",
  "SIM115",              # open() without a context manager
]
ignore = ["E501"]
