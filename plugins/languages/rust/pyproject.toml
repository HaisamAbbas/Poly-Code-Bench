[project]
name = "polycodebench-lang-rust"
version = "0.1.0"
description = "PolyCodeBench Rust language plugin: plans, parsers, profile and guest tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polycodebench-core==0.1.0",
  "polycodebench-plugins-api==0.1.0",
  "PyYAML==6.0.3",
]

[project.entry-points."polycodebench.language_plugins"]
rust = "polycodebench_lang_rust.plugin:RustLanguagePlugin"

[tool.uv.sources]
polycodebench-core = { workspace = true }
polycodebench-plugins-api = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"