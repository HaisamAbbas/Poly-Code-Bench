[project]
name = "polycodebench-workspace"
version = "0.1.0"
description = "PolyCodeBench development workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/languages/*", "plugins/suites/*"]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "mypy-boto3-s3==1.43.93",
  "pytest==9.0.2",
  "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Authored task fixtures contain deliberate defects (bare except, mutable defaults, ...) and are
# analysed by the product's own pipeline, not by the repository's lint gate.
extend-exclude = [
  "plugins/languages/python/fixtures",
  "plugins/languages/go/fixtures",
  "tests/fixtures",
  "plugins/languages/python/src/polycodebench_lang_python/guest",
  "plugins/languages/cpp/fixtures",
  "taskpacks",
]
exclude = [
  "PolyCodeBench-Architecture-v1.md",
  "PolyCodeBench-Technical-Implementation-Spec-v1.md",
  "PolyCodeBench-Codex-End-to-End-Prompt-Pack-v1.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's autogenerated table declarations include long embedded SQL/constraint
# strings; keep the generated revision intact rather than reflowing its DDL text.
"packages/persistence/src/polycodebench_persistence/migrations/versions/*.py" = ["E501"]
# The guest helper is shipped as source into sandbox images and kept deliberately plain.
"packages/runner/src/polycodebench_runner/guest_helper.py" = ["UP031"]
# Rust guest scripts ship as source into the sandbox images and are kept plain; editing them
# changes the recorded guest digest, so lint style never justifies touching them.
"plugins/languages/rust/src/polycodebench_lang_rust/guest/*.py" = ["UP031", "E501"]
"plugins/languages/cpp/src/polycodebench_lang_cpp/guest/*.py" = ["UP031", "E501"]
"plugins/languages/javascript/src/polycodebench_lang_javascript/guest/*.py" = ["UP031", "E501"]
"plugins/languages/java/src/polycodebench_lang_java/guest/*.py" = ["UP031", "E501"]
"plugins/languages/go/src/polycodebench_lang_go/guest/*.py" = ["UP031", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/configuration/src"

[[tool.mypy.overrides]]
# Plain stdlib source shipped into sandbox images and run on POSIX only; covered by tests.
module = "polycodebench_runner.guest_helper"
ignore_errors = true

[[tool.mypy.overrides]]
# Guest scripts are copied verbatim into the pinned runtime/evaluator images and execute inside
# the POSIX sandbox against the image's own interpreter. They are plain stdlib by design (no
# workspace imports, so the images stay self-contained) and are exercised by the image tests.
module = "polycodebench_lang_python.guest.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The Rust guest scripts (context scanner, Miri classifier, libtest parser) have the same
# constraint: plain stdlib, copied verbatim into the pinned Rust images, POSIX-only at runtime.
module = "polycodebench_lang_rust.guest.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The JavaScript/TypeScript guest scripts (run wrapper, capture helper, context scanner, npm audit,
# Vitest report converter) have the same constraint as the other languages' guest scripts: plain
# stdlib, copied verbatim into the pinned Node images, POSIX-only at runtime. Editing them changes
# the recorded guest digest, so lint style never justifies touching them.
module = "polycodebench_lang_javascript.guest.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The Go guest scripts (module audit, idiom scanner, test-event classifier, run wrapper) have the
# same constraint as the Rust ones: plain stdlib, copied verbatim into the pinned Go images,
# POSIX-only at runtime.
module = "polycodebench_lang_go.guest.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The C++ guest scripts (command runner, build/test/sanitize drivers, context scanner, sanitizer
# classifier) carry the same constraint: plain stdlib, copied verbatim into the pinned C++ images,
# POSIX-only at runtime.
module = "polycodebench_lang_cpp.guest.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Java guest scripts are plain stdlib and copied into the pinned Temurin images.
module = "polycodebench_lang_java.guest.*"
ignore_errors = true
