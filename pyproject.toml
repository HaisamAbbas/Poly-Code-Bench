[project]
name = "polycodebench-workspace"
version = "0.1.0"
description = "PolyCodeBench development workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  "PolyCodeBench-Architecture-v1.md",
  "PolyCodeBench-Technical-Implementation-Spec-v1.md",
  "PolyCodeBench-Codex-End-to-End-Prompt-Pack-v1.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/configuration/src"
